[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-path-planning-lab"
version = "0.1.0.dev0"
description = "A Python and Pygame laboratory for grid-based robot path planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pygame==2.6.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
robot-path-lab = "robot_path_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.test_tmp/pytest"
cache_dir = ".cache/pytest"
